name: Bug report
description: Something on openlifemodel.com or in the code doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select the model "…"
        2. Enter …
        3. See …
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - openlifemodel.com
        - Self-hosted (Docker)
        - The engine or spec in this repository
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone 15, Firefox 131 on Windows
  - type: markdown
    attributes:
      value: Please don't paste personal health details you'd rather keep private; a rough description is enough.
