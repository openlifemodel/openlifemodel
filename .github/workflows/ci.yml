name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build static site
        run: pnpm --filter @openlifemodel/web build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: web/out
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build self-hosting image
        run: docker build -t openlifemodel .
      - name: Smoke test
        run: |
          docker run -d --rm -p 8080:8080 --name olm openlifemodel
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "OpenLifeModel"
          curl -fsS http://localhost:8080/models/us-ssa-2023-period/ | grep -q "Reference tests"
          curl -fsS http://localhost:8080/olm/us-ssa-2023-period.olm | grep -q 'olm: "0.1"'
          docker stop olm
