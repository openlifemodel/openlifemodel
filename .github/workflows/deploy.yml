name: Deploy

# Publishes openlifemodel.com whenever main changes. main only changes through
# reviewed PRs with passing checks, and this workflow never runs for pull
# requests, so forks cannot reach the deploy credentials.
# Only changes that affect the published site trigger a deploy, so README and
# docs edits do not use up Cloudflare Pages deployments.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "engine/**"
      - "models/**"
      - "spec/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://openlifemodel.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @openlifemodel/web build
      - name: Publish to Cloudflare Pages
        # Run Wrangler directly: wrangler-action tries to add it to the pnpm
        # workspace root, which pnpm refuses.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4.147.0 pages deploy web/out
          --project-name=openlifemodel --branch=main --commit-hash=${{ github.sha }}
          --commit-dirty=true
