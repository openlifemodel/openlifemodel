# Test fixture: an illustrative OLM 0.1 model exercising every factor type.
# Not shipped on the website.
olm: "0.1"
id: illustrative-lifestyle
name: Illustrative lifestyle model (not evidence-based)
version: 0.1.0
status: illustrative
license: CC-BY-4.0
authors:
  - name: OpenLifeModel contributors
    url: https://github.com/OpenLifeModel/openlifemodel
description: >-
  A demonstration of how an OLM model adjusts a baseline life table for
  personal factors. The hazard ratios and prevalences below are round numbers
  chosen to be roughly plausible; they are NOT taken from a specific study and
  must not be used to draw conclusions about anyone's health.
population: US adults, for demonstration only.
assumptions:
  - Baseline mortality is the SSA 2023 period life table (see us-ssa-2023-period).
  - >-
    Factors act independently and multiply. Real factors are correlated (for
    example BMI and blood pressure), so this double-counts shared effects.
  - Hazard ratios are constant at all ages and for the rest of life.
  - >-
    Hazard ratios are normalized so that a person with population-average
    exposure reproduces the baseline life table.
sources:
  - id: ssa-2023
    citation: >-
      Social Security Administration, Office of the Chief Actuary. Actuarial
      Life Table: Period Life Table, 2023, as used in the 2026 Trustees Report.
    url: https://www.ssa.gov/oact/STATS/table4c6.html
    license: Public domain (US federal government work)
    notes: Death probabilities transcribed from the published table on 4 October 2026.
  - id: illustrative
    citation: Round illustrative values chosen by the OpenLifeModel contributors; not from a study.
