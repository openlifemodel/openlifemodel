adjustment:
  method: proportional-hazards
  normalization: population-average
  factors:
    - id: smoking
      label: Smoking
      input: smoking_status
      type: categorical
      missing: neutral
      source: illustrative
      levels:
        - {value: never, hazard_ratio: 1.0, prevalence: 0.55}
        - {value: former_quit_before_35, hazard_ratio: 1.3, prevalence: 0.10}
        - {value: former_quit_35_44, hazard_ratio: 1.3, prevalence: 0.08}
        - {value: former_quit_45_54, hazard_ratio: 1.3, prevalence: 0.06}
        - {value: former_quit_55_plus, hazard_ratio: 1.3, prevalence: 0.06}
        - {value: former, hazard_ratio: 1.3, prevalence: 0.0}
        - {value: current, hazard_ratio: 2.5, prevalence: 0.15}
    - id: bmi
      label: Body mass index
      input: bmi
      type: banded
      missing: neutral
      source: illustrative
      bands:
        - {max: 18.5, hazard_ratio: 1.5, prevalence: 0.02}
        - {min: 18.5, max: 25, hazard_ratio: 1.0, prevalence: 0.30}
        - {min: 25, max: 30, hazard_ratio: 1.1, prevalence: 0.33}
        - {min: 30, max: 35, hazard_ratio: 1.3, prevalence: 0.20}
        - {min: 35, hazard_ratio: 1.7, prevalence: 0.15}
    - id: activity
      label: Physical activity
      input: mvpa_minutes_per_week
      type: banded
      missing: neutral
      source: illustrative
      bands:
        - {max: 10, hazard_ratio: 1.35, prevalence: 0.25}
        - {min: 10, max: 150, hazard_ratio: 1.15, prevalence: 0.30}
        - {min: 150, max: 300, hazard_ratio: 1.0, prevalence: 0.25}
        - {min: 300, hazard_ratio: 0.95, prevalence: 0.20}
    - id: blood-pressure
      label: Systolic blood pressure
      input: systolic_bp
      type: banded
      missing: neutral
      source: illustrative
      bands:
        - {max: 120, hazard_ratio: 1.0, prevalence: 0.45}
        - {min: 120, max: 140, hazard_ratio: 1.1, prevalence: 0.30}
        - {min: 140, max: 160, hazard_ratio: 1.3, prevalence: 0.17}
        - {min: 160, hazard_ratio: 1.6, prevalence: 0.08}
tests:
  # Regression values produced by the reference engine (OLM 0.1 method).
  - name: Nothing provided reproduces the baseline
    profile: {age: 40, sex: male}
    expect:
      remaining_life_expectancy: {value: 38.5795, tolerance: 0.001}
      combined_hazard_ratio: {value: 1, tolerance: 0.000001}
  - name: Favourable profile, male aged 40
    profile: {age: 40, sex: male, smoking_status: never, bmi: 23, mvpa_minutes_per_week: 200, systolic_bp: 115}
    expect:
      remaining_life_expectancy: {value: 45.9059, tolerance: 0.001}
      median_age_at_death: {value: 88.6192, tolerance: 0.001}
      survival_to_90: {value: 0.4509, tolerance: 0.0001}
      combined_hazard_ratio: {value: 0.4967, tolerance: 0.0001}
  - name: Unfavourable profile, male aged 40
    profile: {age: 40, sex: male, smoking_status: current, bmi: 36, mvpa_minutes_per_week: 0, systolic_bp: 165}
    expect:
      remaining_life_expectancy: {value: 22.6478, tolerance: 0.001}
      survival_to_80: {value: 0.0583, tolerance: 0.0001}
      combined_hazard_ratio: {value: 4.5601, tolerance: 0.0001}
  - name: Partial profile, female aged 65
    profile: {age: 65, sex: female, smoking_status: former, bmi: 27}
    expect:
      remaining_life_expectancy: {value: 21.4511, tolerance: 0.001}
      survival_to_100: {value: 0.0446, tolerance: 0.0001}
