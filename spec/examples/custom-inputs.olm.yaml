adjustment:
  method: proportional-hazards
  normalization: population-average
  factors:
    - id: smoking
      label: Smoking
      input: smoking_status
      type: categorical
      missing: neutral
      source: jha-2013
      notes: >-
        Shares of the population from NHANES 2017-2020. The "former, quit age
        unknown" ratio (1.2) is the population-weighted average of the
        quit-age groups.
      levels:
        - {value: never, hazard_ratio: 1.0, prevalence: 0.582}
        - {value: former_quit_before_35, hazard_ratio: 1.0, prevalence: 0.129}
        - {value: former_quit_35_44, hazard_ratio: 1.2, prevalence: 0.053}
        - {value: former_quit_45_54, hazard_ratio: 1.5, prevalence: 0.039}
        - {value: former_quit_55_plus, hazard_ratio: 1.7, prevalence: 0.029}
        - {value: former, hazard_ratio: 1.2, prevalence: 0.0}
        - {value: current, hazard_ratio: 2.9, prevalence: 0.169}
    - id: bmi
      label: Body mass index
      input: bmi
      type: banded
      missing: neutral
      source: gbmc-2016
      notes: Shares of the population from NHANES 2017-2020 measured BMI.
      bands:
        - {max: 18.5, hazard_ratio: 1.47, prevalence: 0.014}
        - {min: 18.5, max: 25, hazard_ratio: 1.0, prevalence: 0.249}
        - {min: 25, max: 30, hazard_ratio: 1.11, prevalence: 0.317}
        - {min: 30, max: 35, hazard_ratio: 1.44, prevalence: 0.219}
        - {min: 35, max: 40, hazard_ratio: 1.92, prevalence: 0.111}
        - {min: 40, hazard_ratio: 2.71, prevalence: 0.09}
    - id: activity
      label: Exercise
      input: mvpa_minutes_per_week
      type: banded
      missing: neutral
      source: arem-2015
      notes: >-
        Bands are the study's MET-hour categories converted to
        moderate-equivalent minutes (0, under 7.5, 7.5-15, 15-22.5, 22.5-40,
        40-75 and 75+ MET-hours). Shares from NHANES 2017-2020.
      bands:
        - {max: 1, hazard_ratio: 1.0, prevalence: 0.457}
        - {min: 1, max: 150, hazard_ratio: 0.8, prevalence: 0.154}
        - {min: 150, max: 300, hazard_ratio: 0.69, prevalence: 0.118}
        - {min: 300, max: 450, hazard_ratio: 0.63, prevalence: 0.086}
        - {min: 450, max: 800, hazard_ratio: 0.61, prevalence: 0.11}
        - {min: 800, max: 1500, hazard_ratio: 0.61, prevalence: 0.055}
        - {min: 1500, hazard_ratio: 0.68, prevalence: 0.019}
    - id: pm25
      label: Air pollution
      input: pm25
      type: banded
      missing: neutral
      source: demo
      bands:
        - {max: 10, hazard_ratio: 1.0, prevalence: 0.7}
        - {min: 10, max: 20, hazard_ratio: 1.08, prevalence: 0.25}
        - {min: 20, hazard_ratio: 1.17, prevalence: 0.05}
    - id: commute
      label: Commute
      input: commute
      type: categorical
      missing: neutral
      source: demo
      levels:
        - {value: car, hazard_ratio: 1.0, prevalence: 0.9}
        - {value: active, hazard_ratio: 0.9, prevalence: 0.1}
