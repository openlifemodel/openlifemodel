# Example OLM 0.2 model with custom inputs (spec section 3.1).
# It adds two model-declared questions, air pollution (number) and commute
# (choice), to the US lifestyle model. The air pollution and commute numbers
# are ILLUSTRATIVE ONLY; this file shows the format and is not shipped on the site.
olm: "0.2"
id: custom-inputs-example
name: "Example: custom inputs"
version: 0.1.0
status: illustrative
license: CC-BY-4.0
authors:
  - name: OpenLifeModel contributors
    url: https://github.com/OpenLifeModel/openlifemodel
description: >-
  Adjusts US population mortality for three of the best-measured lifestyle
  factors: cigarette smoking (including the age you quit), body mass index and
  leisure-time exercise. Each effect comes from a large published study of
  all-cause mortality; the share of US adults in each group comes from NHANES.
population: >-
  US adults aged roughly 25 to 80, without serious chronic disease. The source
  studies followed people in this range; effects at older ages are extrapolated.
assumptions:
  - >-
    Baseline mortality is the SSA 2023 period life table: today's death rates,
    with no future improvement.
  - >-
    Each factor's hazard ratio is constant over the rest of life. In reality
    the excess risk from high BMI shrinks with age (Global BMI Mortality
    Collaboration 2016), so effects at old age are probably overstated.
  - >-
    Factors multiply. The exercise effect is adjusted for smoking and BMI and
    the smoking effect for adiposity, which limits double-counting; the BMI
    effect is not adjusted for exercise, so part of it may overlap.
  - >-
    Hazard ratios are rescaled so that a person with the average US adult mix
    of each factor reproduces the baseline. The mix is for all adults aged 20
    and over, not specific to your age and sex.
  - >-
    Smoking risk for people who quit is taken from the age at which they
    quit; people who quit within the previous 5 years were counted as current
    smokers in the source study.
  - Exercise means leisure-time activity only, not work or commuting.
sources:
  - id: ssa-2023
    citation: >-
      Social Security Administration, Office of the Chief Actuary. Actuarial
      Life Table: Period Life Table, 2023, as used in the 2026 Trustees Report.
    url: https://www.ssa.gov/oact/STATS/table4c6.html
    license: Public domain (US federal government work)
    notes: Death probabilities transcribed from the published table on 4 October 2026.
  - id: jha-2013
    citation: >-
      Jha P, Ramasundarahettige C, Landsman V, et al. 21st-century hazards of
      smoking and benefits of cessation in the United States. N Engl J Med.
      2013;368(4):341-350.
    doi: 10.1056/NEJMsa1211128
    notes: >-
      NHIS 1997-2004 linked to deaths through 2006; ages 25-79. Hazard ratios
      from Figure 4 (sexes combined), adjusted for age, education, alcohol and
      adiposity.
  - id: gbmc-2016
    citation: >-
      The Global BMI Mortality Collaboration. Body-mass index and all-cause
      mortality: individual-participant-data meta-analysis of 239 prospective
      studies in four continents. Lancet. 2016;388(10046):776-786.
    doi: 10.1016/S0140-6736(16)30175-1
    notes: >-
      Primary analysis (never-smokers without chronic disease, first 5 years of
      follow-up excluded), WHO categories relative to 18.5-25, adjusted for age
      and sex (Table 1).
  - id: arem-2015
    citation: >-
      Arem H, Moore SC, Patel A, et al. Leisure time physical activity and
      mortality: a detailed pooled analysis of the dose-response relationship.
      JAMA Intern Med. 2015;175(6):959-967.
    doi: 10.1001/jamainternmed.2015.0533
    notes: >-
      Six US and European cohorts, 661,137 adults. Hazard ratios by MET-hours
      per week (1 MET-hour = 20 moderate-equivalent minutes), adjusted for age,
      sex, race, education, smoking, alcohol, marital status, cancer and heart
      disease history, and BMI.
  - id: demo
    citation: Illustrative values chosen to demonstrate custom inputs; not from a study.
  - id: nhanes-2017-2020
    citation: >-
      National Center for Health Statistics. National Health and Nutrition
      Examination Survey, 2017-March 2020 prepandemic files (P_DEMO, P_BMX,
      P_SMQ, P_PAQ). Survey-weighted shares of adults aged 20 and over.
    url: https://wwwn.cdc.gov/nchs/nhanes/continuousnhanes/default.aspx?Cycle=2017-2020
    license: Public domain (US federal government work)
    notes: Computed by models/derivations/nhanes_prevalence.py in this repository.
inputs:
  - id: pm25
    label: Air pollution
    question: Average PM2.5 where you live
    help: Your city's annual average is on its air quality website.
    type: number
    unit: µg/m³
    min: 0
    max: 200
  - id: commute
    label: Commute
    type: choice
    choices:
      - {value: car, label: Car or transit}
      - {value: active, label: Walk or cycle}
